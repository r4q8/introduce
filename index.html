        * { font-family: 'JetBrains Mono', monospace; }
        .video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(255,255,255,0.4)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 14px rgba(255,255,255,0.9)); transform: scale(1.08); }
        }

        @keyframes slash-draw {
            0% { stroke-dashoffset: 2000; }
            100% { stroke-dashoffset: 0; }
        }

        @keyframes split-tr {
            0% { transform: translate(-50%,-50%); }
            100% { transform: translate(60%, -60%); opacity: 0; }
        }
        @keyframes split-bl {
            0% { transform: translate(-50%,-50%); }
            100% { transform: translate(-160%, 60%); opacity: 0; }
        }

        @keyframes fade-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        #intro { transition: opacity 0.6s ease; z-index: 50; background-color: #000000; }
        #intro.done { opacity: 0; pointer-events: none; }

        .enter-btn { animation: pulse-glow 2.2s infinite ease-in-out; cursor: pointer; }
        .enter-btn:hover { filter: drop-shadow(0 0 20px #fff) !important; }

        .sliced .panel-tr { animation: split-tr 1s cubic-bezier(.4,0,.2,1) forwards; }
        .sliced .panel-bl { animation: split-bl 1s cubic-bezier(.4,0,.2,1) forwards; }
        .sliced .slash-line { animation: slash-draw 0.6s ease forwards; }

        .profile-card { animation: fade-up 0.8s ease both; }
        .profile-card.delayed { animation-delay: 0.3s; }

        .social-link {
            transition: all 0.25s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .social-link:hover {
            border-color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }

        .avatar-ring {
            background: conic-gradient(#fff 0deg, #666 120deg, #fff 240deg, #666 360deg);
            padding: 3px;
            border-radius: 9999px;
            animation: spin-slow 8s linear infinite;
        }
        @keyframes spin-slow { to { transform: rotate(360deg); } }

        .typing::after {
            content: '|';
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .social-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ddd;
            padding: 12px 15px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            width: 100%;
        }
        
        .social-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.1);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
            z-index: 0;
        }

        .social-btn:hover {
            color: #fff;
            border-color: #fff;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.15);
        }
        .social-btn:hover::before { transform: scaleX(1); transform-origin: left; }
        .social-btn > * { position: relative; z-index: 1; }
    </style>

  <script>
    function updateClock() {
        const now = new Date();
        document.getElementById('live-time').textContent = now.toLocaleTimeString('en-US', { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function triggerSlice() {
        const intro = document.getElementById('intro');
        intro.classList.add('sliced');
        
        const video = document.getElementById('bg-video');
        if (video) {
            video.classList.remove('opacity-0');
            video.classList.add('opacity-100');
            video.muted = false;
            video.play().catch(err => console.log("Audio play blocked: ", err));
        }

        setTimeout(() => {
            intro.classList.add('done');
            document.getElementById('main-content').style.opacity = '1';
        }, 1000);
        setTimeout(() => { intro.style.display = 'none'; }, 1600);
    }

    lucide.createIcons();

    const defaultConfig = {
        username: 'kaelx_0327',
        tagline: 'Python Developer | 14y | Hold It On',
        background_color: '#000000',
        text_color: '#ffffff',
        accent_color: '#333333',
        font_family: 'JetBrains Mono',
        font_size: 16
    };

    function applyConfig(config) {
        const c = { ...defaultConfig, ...config };
        document.getElementById('display-username').textContent = c.username;
        document.getElementById('display-tagline').textContent = c.tagline;

        const app = document.getElementById('app');
        const main = document.getElementById('main-content');
        
        app.style.backgroundColor = c.background_color;
        main.style.background = `radial-gradient(ellipse at center, ${c.accent_color}80 0%, ${c.background_color}D9 70%)`;

        document.querySelectorAll('h1, .social-link, span, p, a, div').forEach(el => {
            if (el.id === 'display-username') el.style.color = c.text_color;
        });
        document.getElementById('display-username').style.fontFamily = `${c.font_family}, monospace`;
        document.getElementById('display-tagline').style.fontFamily = `${c.font_family}, monospace`;

        const base = c.font_size;
        document.getElementById('display-username').style.fontSize = `${base * 1.5}px`;
        document.getElementById('display-tagline').style.fontSize = `${base * 0.875}px`;
    }

    window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => applyConfig(config),
        mapToCapabilities: (config) => ({
            recolorables: [
                { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
                { get: () => config.accent_color || defaultConfig.accent_color, set: (v) => { config.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); } },
                { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } }

                set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); }
            }
        }),
        mapToEditPanelValues: (config) => new Map([
            ['username', config.username || defaultConfig.username],
            ['tagline', config.tagline || defaultConfig.tagline]
        ])
    });
