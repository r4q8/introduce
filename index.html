<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM UPDATE // 系統升級中</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #050508;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(18, 24, 38, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(18, 24, 38, 0.5) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center;
            z-index: 1;
        }

        .glow-bg {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.15) 0%, rgba(138, 43, 226, 0.05) 50%, transparent 100%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            filter: blur(40px);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loader-ring {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
        }

        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid transparent;
            border-radius: 50%;
            animation: rotate 4s linear infinite;
        }

        .ring-1 {
            border-top-color: #00f2fe;
            border-bottom-color: #00f2fe;
            animation-duration: 3s;
        }

        .ring-2 {
            width: 85%;
            height: 85%;
            border-left-color: #8a2be2;
            border-right-color: #8a2be2;
            animation-direction: reverse;
            animation-duration: 2s;
        }

        .ring-3 {
            width: 70%;
            height: 70%;
            border-top-color: #00ff87;
            animation-duration: 4s;
        }

        .core {
            width: 20px;
            height: 20px;
            background-color: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 30px #00f2fe, 0 0 60px #00f2fe;
            animation: pulse 1.5s ease-in-out infinite alternate;
        }


        .status-tag {
            font-size: 12px;
            letter-spacing: 4px;
            color: #00f2fe;
            text-transform: uppercase;
            margin-bottom: 12px;
            padding: 4px 12px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 4px;
            background: rgba(0, 242, 254, 0.05);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 6px;
            background: linear-gradient(45deg, #ffffff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        p {
            font-size: 1rem;
            color: #9ca3af;
            letter-spacing: 2px;
            font-weight: 300;
        }

        .progress-bar-container {
            width: 250px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            margin-top: 30px;
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }

        .progress-line {
            position: absolute;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, #8a2be2, #00f2fe);
            box-shadow: 0 0 10px #00f2fe;
            animation: loading 2.5s ease-in-out infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 20px #00f2fe; }
            100% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 40px #00f2fe, 0 0 80px #00f2fe; }
        }

        @keyframes loading {
            0% { left: -40%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-tag">SYSTEM MAINTENANCE</div>
        <h1>網站正在更新</h1>
        <p>website is up dating</p><!DOCTYPE html>
        <div class="progress-bar-container">
            <div class="progress-line"></div>
        </div>
    </div>

</body>
</html>
